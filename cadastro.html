<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Biblioteca</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="form-container">
    <h1>Biblioteca</h1>
    <p>Formulário de Cadastro</p>

    <form>
      
      <div class="input-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
      </div>

      <div class="input-group">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" placeholder="Digite seu telefone" required maxlength="9">
      </div>

      <div class="input-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Crie um usuário" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required maxlength="8">
      </div>

      <div class="input-group">
        <label for="confirmar">Confirmar Senha</label>
        <input type="password" id="confirmar" placeholder="Confirme sua senha" required maxlength="8">
      </div>

      <button type="submit" class="btn">Cadastrar</button>

    </form>

    <div class="footer">
      <p>Já possui conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

</body>
</html>
